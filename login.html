<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#181A20">
<title>Log In | Binance</title>
<style>
@font-face{font-family:BinanceNova;font-display:swap;src:url("https://bin.bnbstatic.com/static/fonts/bn/v2/BinanceNova-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:BinanceNova;font-display:swap;src:url("https://bin.bnbstatic.com/static/fonts/bn/v2/BinanceNova-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:BinanceNova;font-display:swap;src:url("https://bin.bnbstatic.com/static/fonts/bn/v2/BinanceNova-SemiBold.woff2") format("woff2");font-weight:600 800}
:root{--bg:#181A20;--input:#29313D;--line:#333B47;--inputline:#474D57;--txt:#EAECEF;--txt2:#929AA5;--txt3:#707A8A;--yellow:#F0B90B;--btn:#FCD535;--ontxt:#202630;--red:#F6465D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:BinanceNova,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}input{font-family:inherit}
main{flex:1;display:flex;flex-direction:column}
.layout{display:flex;flex-direction:column;align-items:center;padding:80px 24px 48px;flex:1}
.card{width:100%;max-width:425px}
.icon-wrap{margin-bottom:32px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.title{font-weight:600;font-size:32px;line-height:40px}
.qr{width:40px;height:40px;padding:4px;border-radius:8px;background:var(--input);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.qr svg{width:32px;height:32px;color:var(--txt)}
.formItem{margin-bottom:16px}
label{display:block;font-size:14px;color:var(--txt2);margin-bottom:8px}
.labrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.labrow label{margin-bottom:0}
.field{border:1px solid var(--inputline);border-radius:4px;display:flex;background:transparent}
.field:focus-within{border-color:var(--yellow)}
.field input{width:100%;height:50px;padding:6px 10px;font-size:16px;background:transparent;border:0;outline:0;color:var(--txt);border-radius:4px}
.field input::placeholder{color:var(--inputline)}
.btn{width:100%;height:50px;border:0;border-radius:4px;background:var(--btn);color:var(--ontxt);font-size:16px;font-weight:500;margin-top:24px}
.btn:active{background:#E8C41F}
.or{display:flex;align-items:center;margin:16px 0}
.or i{flex:1;height:1px;background:var(--line)}
.or span{padding:0 16px;font-size:14px;color:var(--txt)}
.signwith{display:flex;flex-direction:column;gap:16px;width:100%}
.btn-icon{width:100%;height:50px;border:1px solid var(--inputline);border-radius:4px;background:transparent;color:var(--txt);font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-icon:hover{background:var(--input)}
.iw{width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto}
.links{margin-top:16px;margin-bottom:32px}
.lnk{background:none;border:0;color:var(--yellow);font-size:16px;line-height:24px;padding:0;text-decoration:underline;text-underline-offset:3px}
.lnk.sm{font-size:14px}
.lnkrow{margin-top:8px;display:flex;justify-content:flex-start}
.err{display:none;color:var(--red);font-size:14px;margin-top:8px}
.err.on{display:block}
.back{width:24px;height:24px;display:grid;place-items:center;background:none;border:0;color:var(--txt);padding:0;margin-bottom:16px}
footer{height:70px;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;flex:0 0 auto;padding:0 16px}
.lang{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--txt2)}
.lang:hover{color:var(--yellow)}
.globe{width:16px;height:16px}
.lnk2{cursor:pointer;margin-left:16px}
.lnk2:hover{color:var(--yellow)}
@media(max-width:767px){
 .layout{align-items:flex-start;padding:8px 24px 16px}
 .title{font-size:28px;line-height:36px}
 .icon-wrap{padding:12px 0 20px;margin-bottom:8px}
 footer{width:100%}
}
@media(min-width:768px){.lnkrow{justify-content:center}}
</style></head><body>
